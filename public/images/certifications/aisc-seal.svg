<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <!-- Top text arc -->
    <path id="aisc-top-arc" d="M 42 150 A 108 108 0 0 1 258 150" fill="none" />
    <!-- Bottom text arc -->
    <path id="aisc-bottom-arc" d="M 258 150 A 108 108 0 0 1 42 150" fill="none" />
  </defs>

  <!-- Outer Ring Borders -->
  <circle cx="150" cy="150" r="142" stroke="currentColor" stroke-width="12" fill="none" />
  <circle cx="150" cy="150" r="132" stroke="currentColor" stroke-width="2.5" fill="none" />
  <circle cx="150" cy="150" r="88" stroke="currentColor" stroke-width="5" fill="none" />

  <!-- Perimeter Text -->
  <text font-family="'Space Grotesk', 'Arial Black', Impact, sans-serif" font-weight="900" font-size="13.5" fill="currentColor" letter-spacing="1.8">
    <textPath href="#aisc-top-arc" startOffset="50%" text-anchor="middle">
      AMERICAN INSTITUTE OF STEEL CONSTRUCTION
    </textPath>
  </text>
  
  <text font-family="'Space Grotesk', 'Arial Black', Impact, sans-serif" font-weight="900" font-size="14.5" fill="currentColor" letter-spacing="2.8">
    <textPath href="#aisc-bottom-arc" startOffset="50%" text-anchor="middle">
      ★ FOUNDED 1921 ★
    </textPath>
  </text>

  <!-- Center AISC Emblem Monogram -->
  <g fill="currentColor">
    <!-- 'A' Left outer curve & stem -->
    <path d="M 94 88 C 80 102 74 122 74 150 C 74 178 80 198 94 212 L 108 212 C 98 196 92 178 92 150 C 92 122 98 104 108 88 Z" />
    <rect x="110" y="88" width="12" height="124" rx="2" />
    <rect x="94" y="148" width="28" height="11" />
    
    <!-- 'I' Central pillar -->
    <rect x="131" y="88" width="13" height="124" rx="2" />

    <!-- 'S' Center Interlaced -->
    <path d="M 172 88 L 152 88 L 152 100 L 168 100 C 172 100 174 104 174 110 L 174 136 C 174 142 170 146 164 146 L 152 146 L 152 212 L 164 212 C 176 212 186 202 186 190 L 186 160 C 186 150 178 142 168 140 C 176 138 184 130 184 120 L 184 106 C 184 94 178 88 172 88 Z M 174 188 C 174 196 170 200 164 200 L 164 158 C 170 158 174 164 174 172 Z" />

    <!-- 'C' Right outer curve -->
    <path d="M 206 88 C 196 104 190 122 190 150 C 190 178 196 196 206 212 L 220 212 C 206 198 200 178 200 150 C 200 122 206 102 220 88 Z" />
    <path d="M 204 88 L 226 88 C 226 88 222 100 206 100 Z" />
    <path d="M 204 212 L 226 212 C 226 212 222 200 206 200 Z" />
  </g>
</svg>
